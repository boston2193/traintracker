<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cars</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:13px -apple-system,system-ui,sans-serif;padding:2px 6px 96px;-webkit-user-select:none;user-select:none}

.tr{padding:5px 0 4px}
.hd{display:flex;justify-content:space-between;padding:0 2px 1px}

.cs{display:flex;gap:3px;flex:1;min-width:0}

.f15{background:#C9CED4;color:#1F3A7A}.f15 i{height:4px;background:#1F3A7A}.f15 u{height:4px;background:#D4A62A}
.f16{background:#C9CED4;color:#1E2227;box-shadow:inset 0 0 0 1.5px #FFD60A}.f16 u{height:7px;margin:0 1.5px 1.5px;background:linear-gradient(#DA291C 2px,#C9CED4 2px,#C9CED4 4px,#DA291C 4px,#DA291C 6px,#C9CED4 6px)}
.f17{background:#fff;color:#111}.f17 i{height:3px;background:#A9AFB6}.f17 u{height:10px;background:#DA291C}
.f18{background:#4A4F56;color:#fff}.f18 u{height:4px;background:#DA291C}
.f19{background:#A9AFB6;color:#1E2227}.f19 i{height:4px;background:#DA291C}
.f36,.f37{background:#D2B98C;color:#4A3818}

#backBtn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#backBtn.off{opacity:.35}
#homeBtn,#logBtn{flex:0 0 42px;font-size:17px;padding:6px 0}

.grp.O{color:#FFB366}

.fO0{background:#8E8E93}.fO1{background:#30D158}.fO2{background:#FFD60A}.fO3{background:#FF453A;color:#fff}
.tg{display:flex;justify-content:space-between}.tg::after{content:"Off";color:#666}.tg.on::after{content:"On";color:#30D158}
.fr{display:flex;align-items:center;gap:6px;margin-top:6px;background:#1c1c1e;border-radius:12px;padding:4px 4px 4px 10px}

.oc{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px #000}
.o1{background:#30D158}.o2{background:#FFD60A}.o3{background:#FF453A}
.lat{display:flex;align-items:center;gap:6px;padding:3px 2px;font-size:12px;color:#aaa}
.lat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mini{display:flex;gap:2px;flex:0 0 auto}.mini .car{zoom:.5;flex:0 0 20px;height:28px;border-radius:6px}

.ns{margin-top:6px;padding:4px 2px}.ns small{display:block;font-size:11px;color:#8e8e93}.ns div{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ns span{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ns b{font-size:19px;font-weight:600;color:#FFD60A;white-space:nowrap}
.car.xmas{outline:2px solid #FF453A;outline-offset:1px;animation:xo 1.2s steps(1) infinite}
.car.xmas::after{content:'';position:absolute;inset:0;border-radius:inherit;border:3px dotted #FF453A;animation:xm 1.2s steps(1) infinite;pointer-events:none}
.car.xmas:nth-child(2n),.car.xmas:nth-child(2n)::after{animation-delay:-.4s}.car.xmas:nth-child(3n),.car.xmas:nth-child(3n)::after{animation-delay:-.8s}
@keyframes xm{0%{border-color:#FF453A;box-shadow:inset 0 0 8px 2px #FF453A}17%{border-color:#FF9F0A;box-shadow:inset 0 0 8px 2px #FF9F0A}33%{border-color:#FFD60A;box-shadow:inset 0 0 8px 2px #FFD60A}50%{border-color:#30D158;box-shadow:inset 0 0 8px 2px #30D158}67%{border-color:#0A84FF;box-shadow:inset 0 0 8px 2px #0A84FF}83%{border-color:#BF5AF2;box-shadow:inset 0 0 8px 2px #BF5AF2}}
@keyframes xo{0%{outline-color:#30D158}17%{outline-color:#0A84FF}33%{outline-color:#BF5AF2}50%{outline-color:#FF453A}67%{outline-color:#FF9F0A}83%{outline-color:#FFD60A}}
.f70,.f71,.f72,.f73,.f74,.f75,.f76,.f77{background:#E6E9EC;color:#0B2E6B}.f70 u,.f71 u,.f72 u,.f73 u,.f74 u,.f75 u,.f76 u,.f77 u{height:5px;background:#003DA5}
.fBus{background:#FFC72C;color:#111}

.big{background:#5a0000;color:#fff;border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px;line-height:1.3}
.big b{display:block;font-size:14px;font-weight:700;color:#FF9F9F}
.al{background:#3a2a00;color:#FFD60A;border-radius:10px;padding:5px 8px;margin-top:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al.open{white-space:normal}
.dim{opacity:.5}
.hd.tap span:first-child::after{content:" ›";color:#666}
.hd em{font-style:normal;font-size:10px;background:#5a3a00;color:#FFB340;border-radius:4px;padding:0 4px;margin-right:4px}
.lat em{font-style:normal;color:#FFB340}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.kp button{margin:0;text-align:center;font-size:18px;padding:8px 0}
.num{font-size:26px;text-align:center;letter-spacing:4px;font-variant-numeric:tabular-nums;padding:4px 0;min-height:38px}
.sr{display:flex;justify-content:space-between;padding:4px 2px;border-top:.5px solid #222;font-size:12px}
.sr.pin{color:#FFD60A}.sr b{font-weight:600}
.bus{display:flex;justify-content:space-between;padding:5px 2px;border-top:.5px solid #222}
.bus span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:6px}
.none{font-size:11px;color:#666;padding:2px}
.msg{color:#888;font-size:12px;padding:8px 2px}
#wake{position:fixed;top:30px;left:50%;transform:translateX(-50%);background:#0A84FF;color:#fff;border-radius:10px;padding:3px 10px;font-size:12px;display:none;z-index:9}
#toast{position:fixed;left:6px;right:6px;bottom:52px;background:#2c2c2e;border-radius:14px;padding:6px 6px 6px 12px;display:none;align-items:center;justify-content:space-between}
#toast button{width:auto;margin:0;background:#FFD60A;color:#2a2200;padding:4px 12px}
.lr{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:.5px solid #2a2a2a}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid #555;flex-shrink:0}
.ck.on{background:#30D158;border-color:#30D158}
.lr .car{flex:0 0 52px}
.lr small{color:#888;font-size:11px;margin-left:auto;text-align:right}
.lr .del{width:26px;height:26px;margin:0;padding:0;text-align:center;border-radius:50%;background:#3a1a1a;color:#FF6961;flex-shrink:0;font-size:13px}
</style>
</head>
<body>
<div id="hdr"><span id="st">Loading…</span><span id="age"></span></div>
<div id="main"></div>
<div id="nav"><button id="backBtn">‹ Back</button><button id="homeBtn" aria-label="Stops">🏠</button><button id="logBtn" aria-label="Ride log">✅</button></div>
<div id="wake">↻ Updated</div><div id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>
<script>
// ===== Settings =====
const KEY = 'a0bc163d699f4a85b3b8b444a49e3e08';     // free MBTA API key (api-v3.mbta.com) – optional but recommended
const SYNC = 'https://script.google.com/macros/s/AKfycbw168XU_m9lGvkf1dL7LszLrWlJVFi2uMMikMx5RMB5YzNgaB02uOxO3o7zKRPyAhFP/exec';    // Google Apps Script web app URL – optional, sends your log to a Google Sheet
// "Your stops" in the train view, by line and direction: [outbound/southbound, inbound/northbound]
const PINS = {Red:[['place-pktrm'], ['place-harsq']], Green:[['place-tapst','place-bcnfd'], ['place-pktrm']]};
const GLDOWN_PIN = 'place-dwnxg';  // when Green Line is shuttled, Red into town pins DTX and shows Forest Hills trains
// Holiday vehicles with Christmas lights. Set HOLIDAY = false when they're gone.
const HOLIDAY = true;
const XMAS = {Red:['1938','1939','1940','1941','1962','1963'], Orange:['1410','1411','1462','1463','1502','1503'],
  Blue:['700','701','714','715','762','763'], Green:['3704','3875'], Bus:['1981','2027']};
const XFER_MIN = 3;  // minutes to walk from the bus to the Red Line platform at Harvard
const BUS = [  // Find bus: inbound stop is matched by words in its name; outbound leaves from Harvard
  {n:'74 / 75 / 78', r:['74','75','78'], words:['concord','huron']},
  {n:'71 / 73', r:['71','73'], words:['auburn','sparks']}
];
// ====================

const API = 'https://api-v3.mbta.com';
const ALLR = ['Red','Green-B','Green-C','Green-D','Green-E','Orange'];
const DEF = {fav:['place-pktrm','place-harsq','place-chmnl','place-dwnxg','place-tapst','place-bcnfd','place-sstat','place-kencl']};
let S = loadS();
function loadS(){ const d = JSON.parse(JSON.stringify(DEF)); try { d.fav = JSON.parse(localStorage.settings || '{}').fav || d.fav; } catch(e) {} return d; }
function saveS(){ try { localStorage.settings = JSON.stringify(S); } catch(e) {} }
const routes = () => ALLR;
const lineOf = r => r.startsWith('Green') ? 'Green' : r;

const GROUPS = [
  {r:['Red'],d:0,c:'R',l:'Red · southbound'},
  {r:['Red'],d:1,c:'R',l:'Red · northbound'},
  {r:['Green-D'],d:0,c:'G'},
  {r:['Green-C'],d:0,c:'G'},
  {r:['Green-D','Green-E'],d:1,c:'G'},
  {r:['Green-B','Green-E'],d:0,c:'G'},
  {r:['Green-B','Green-C'],d:1,c:'G'},
  {r:['Orange'],d:0,c:'O',l:'Orange · southbound'},
  {r:['Orange'],d:1,c:'O',l:'Orange · northbound'}
];
const $ = id => document.getElementById(id);
let lay = [], numIn = '', numQ = '', ride = null, fStop = null, AL = {id:'', t:0, list:[]}, alOpen = -1, okT = 0, stops = [], stop = null, last = [], got = 0, rides = load(), lastAdd = null, tT = null, view = 'trains', showDone = false, ckT = null;

function load(){ try { return JSON.parse(localStorage.rides || '[]'); } catch(e) { return []; } }
function save(){ try { localStorage.rides = JSON.stringify(rides); } catch(e) {} }

async function api(p){
  const r = await fetch(API + p + (KEY ? '&api_key=' + KEY : ''));
  if (!r.ok) throw Error(r.status);
  return r.json();
}

const GRP = [
  ['Red downtown','Red','R',null,'Alewife,Davis,Porter,Harvard,Central,Kendall/MIT,Charles/MGH,Park Street,Downtown Crossing,South Station,Broadway,Andrew,JFK/UMass'],
  ['Green downtown','Green','G',null,'Medford/Tufts,Ball Square,Magoun Square,Gilman Square,East Somerville,Union Square,Lechmere,Science Park/West End,North Station,Haymarket,Government Center,Park Street,Boylston,Arlington,Copley,Hynes Convention Center,Kenmore'],
  ['C branch','Green','G','Green-C','Saint Marys Street,Hawes Street,Kent Street,Saint Paul Street,Coolidge Corner,Summit Avenue,Brandon Hall,Fairbanks Street,Washington Square,Tappan Street,Dean Road,Englewood Avenue,Cleveland Circle'],
  ['D branch','Green','G','Green-D','Fenway,Longwood,Brookline Village,Brookline Hills,Beaconsfield,Reservoir,Chestnut Hill,Newton Centre,Newton Highlands,Eliot,Waban,Woodland,Riverside'],
  ['Ashmont','Red','R',null,'Savin Hill,Fields Corner,Shawmut,Ashmont'],
  ['Braintree','Red','R',null,'North Quincy,Wollaston,Quincy Center,Quincy Adams,Braintree'],
  ['B branch','Green','G','Green-B','Blandford Street,Boston University East,Boston University Central,Amory Street,Babcock Street,Packards Corner,Harvard Avenue,Griggs Street,Allston Street,Warren Street,Washington Street,Sutherland Road,Chiswick Road,Chestnut Hill Avenue,South Street,Boston College'],
  ['E branch','Green','G','Green-E','Prudential,Symphony,Northeastern University,Museum of Fine Arts,Longwood Medical Area,Brigham Circle,Fenwood Road,Mission Park,Riverway,Back of the Hill,Heath Street'],
  ['Orange Line','Orange','O',null,'North Station,Haymarket,State,Downtown Crossing,Chinatown,Tufts Medical Center,Back Bay,Massachusetts Avenue,Ruggles,Roxbury Crossing,Jackson Square,Stony Brook,Green Street,Forest Hills,Community College,Sullivan Square,Assembly,Wellington,Malden Center,Oak Grove']
].map(([n,L,c,r,l]) => ({n, L, c, r, order:l.split(',').map(norm), list:[]}));
let openG = -1, keyOpen = false, armed = false, armT = null;
const KEYS = (HOLIDAY ? [['f19 xmas','Holiday lights']] : []).concat([['f15','1500s','Red'],['f16','1600s','Red'],['f17','1700s','Red'],['f18','1800s','Red'],['f19','1900s','Red'],['f36','Type 7','Green'],['f38','Type 8','Green'],['f39','Type 9','Green'],['fO1','Orange · roomy'],['fO2','Orange · getting full'],['fO3','Orange · packed'],['fO0','Orange · no data']]);
const keyH = () => `<button class="grp" data-key="1">${keyOpen ? '▾' : '▸'} Color key</button>` + (keyOpen ? '<div class="key">' + KEYS.map(([f,n]) => `<div class="car ${f}"><i></i><span>${n}</span><u></u></div>`).join('') + '</div>' : '');
const TERM = {'place-alfcl':[['Red',1]],'place-asmnl':[['Red',0]],'place-brntn':[['Red',0]],'place-lake':[['Green-B',0]],'place-clmnl':[['Green-C',0]],'place-river':[['Green-D',0]],'place-hsmnl':[['Green-E',0]],'place-mdftf':[['Green-E',1]],'place-unsqu':[['Green-D',1]],'place-ogmnl':[['Orange',1]],'place-forhl':[['Orange',0]]};
const isTerm = (id,r,d) => (TERM[id] || []).some(x => x[0] === r && x[1] === d);
// ---- Navigation: back returns to the screen you came from ----
let hist = [], cur = null, goingBack = false;
function snap(){
  const d = {v:view, stop, ride, fStop, numQ, numO, busSet, busDir};
  d.k = view + '|' + (view === 'trains' ? stop && stop.id : view === 'ride' ? ride && ride.vid : view === 'find2' ? fStop && fStop.id : view === 'num2' ? numQ : view === 'bus2' ? busSet : view === 'bus3' ? busSet + '' + busDir : '');
  return d;
}
const LBL = d => ({hol:'Holiday', pick:'Stops', trains:d.stop ? d.stop.n : 'Station', ride:'Train', find1:'Where', find2:'1500s', num:'Keypad', num2:'Car ' + d.numQ, bus1:'Bus', bus2:BUS[d.busSet] ? BUS[d.busSet].n : 'Bus', bus3:'Bus times', log:'Ride log', set:'Settings', addfav:'Add stop'})[d.v] || 'Back';
function nav(){
  const d = snap();
  if (!goingBack && cur && cur.k !== d.k) { hist.push(cur); if (hist.length > 25) hist.shift(); }
  if (!cur || cur.k !== d.k) scrollTo(0, 0);
  cur = d;
  const p = hist[hist.length - 1];
  $('backBtn').textContent = '‹ ' + (p ? LBL(p) : 'Back');
  $('backBtn').classList.toggle('off', !p);
  $('main').classList.remove('dim'); okT = 0; $('age').textContent = '';
}
function show(d){
  goingBack = true;
  try {
    ({stop, ride, fStop, numQ, numO, busSet, busDir} = d);
    ({pick:() => picker(), trains:() => setStop(d.stop), ride:() => startRide(d.ride.vid, d.ride), find1:find1, find2:openFind2,
      num:keypad, num2:openNum2, hol:openHol, bus1:bus1, bus2:bus2, bus3:openBus3, log:showLog, set:settings, addfav:() => picker(true)}[d.v] || picker)();
  } finally { goingBack = false; }
}
function goBack(){ const p = hist.pop(); if (p) show(p); }
function goHome(){ hist = []; goingBack = true; try { picker(); } finally { goingBack = false; } }
function openFind2(){ view = 'find2'; nav(); $('st').textContent = '1500/1600s near ' + fStop.n; $('main').innerHTML = '<div class="msg">Looking…</div>'; scrollTo(0, 0); loadFind(); }
function openNum2(){ view = 'num2'; nav(); $('st').textContent = 'Car ' + numQ; $('main').innerHTML = '<div class="msg">Looking…</div>'; scrollTo(0, 0); loadNum(); }
function openBus3(){ view = 'bus3'; nav(); $('st').textContent = BUS[busSet].n + (busDir ? ' · to Harvard' : ' · outbound'); $('main').innerHTML = '<div class="msg">Loading…</div>'; scrollTo(0, 0); loadBus(); }

function norm(s){ return s.toLowerCase().replace(/^st\.? /,'saint ').replace(/[^a-z0-9]/g,''); }

async function getStops(){
  let c = {};
  try { c = JSON.parse(localStorage.stops4 || '{}'); } catch(e) {}
  const need = routes().filter(r => !c[r] || Date.now() - c[r].t > 6048e5);
  const res = await Promise.all(need.map(r => api('/stops?filter[route]=' + r + '&fields[stop]=name,latitude,longitude')));
  res.forEach((j,i) => c[need[i]] = {t:Date.now(), s:j.data.map(x => ({id:x.id, n:x.attributes.name, la:x.attributes.latitude, lo:x.attributes.longitude}))});
  if (need.length) try { localStorage.stops4 = JSON.stringify(c); } catch(e) {}
  const m = {};
  routes().forEach(r => c[r].s.forEach(x => { (m[x.id] = m[x.id] || Object.assign({r:[]}, x)).r.push(r); }));
  const all = Object.values(m);
  GRP.forEach(g => g.list = []);
  for (const s of all) {
    const k = norm(s.n);
    for (const L of [...new Set(s.r.map(lineOf))]) {
      const gs = GRP.filter(g => g.L === L);
      const g = gs.find(g => g.order.includes(k)) || (L === 'Green' && gs.find(g => g.r && s.r.includes(g.r))) || gs[0];
      g.list.push(s);
    }
  }
  GRP.forEach(g => g.list.sort((a,b) => {
    const i = g.order.indexOf(norm(a.n)), j = g.order.indexOf(norm(b.n));
    return (i < 0 ? 999 : i) - (j < 0 ? 999 : j) || a.n.localeCompare(b.n);
  }));
  return all;
}

function picker(adding){
  view = adding ? 'addfav' : 'pick';
  $('st').textContent = adding ? 'Add a quick stop' : 'Stops';
  nav();
  const b = (s,k) => `<button data-s="${s.id}"${k ? ' class="kid"' : ''}>${s.n}</button>`;
  $('main').innerHTML = (adding ? '' : S.fav.map(id => stops.find(s => s.id === id)).filter(Boolean).map(s => b(s)).join(''))
    + GRP.map((g,i) => g.list.length ? `<button class="grp ${g.c}" data-g="${i}">${openG === i ? '▾' : '▸'} ${g.n}</button>`
      + (openG === i ? g.list.map(s => b(s,1)).join('') : '') : '').join('')
    + (adding ? '' : (HOLIDAY ? '<button id="holBtn">🎄 Find holiday vehicles</button>' : '') + '<button id="findBtn">Find 1500/1600s</button><button id="numBtn">Find a car number</button><button id="busBtn">Find bus</button>' + keyH() + '<button id="setBtn">Settings</button>');
}

function settings(){
  view = 'set';
  $('st').textContent = 'Settings';
  nav();
  $('main').innerHTML = ''
    + '<div class="sec">Quick stops</div>'
    + (S.fav.map(id => { const s = stops.find(x => x.id === id); return s ? `<div class="fr"><span>${s.n}</span><button data-unfav="${id}">✕</button></div>` : ''; }).join('') || '<div class="none">No quick stops</div>')
    + '<button data-addfav="1">+ Add a quick stop</button>'
    + `<button data-reset="1">${armed ? 'Tap again to reset everything' : 'Reset all settings'}</button>`
    + '<div class="none">Back to the original quick stops. Your ride log is kept.</div>';
}

async function changed(){
  try { stops = await getStops(); } catch(e) { toast('Can’t reach the MBTA'); }
  if (stop && !stops.find(x => x.id === stop.id)) stop = null;
  else if (stop) stop = stops.find(x => x.id === stop.id);
  settings();
}

function setStop(s){
  stop = s; view = 'trains'; alOpen = -1; nav();
  $('st').textContent = s.n;
  $('main').innerHTML = '<div class="msg">Loading…</div>';
  try { history.replaceState(null, '', '?stop=' + s.id); } catch(e) {}
  scrollTo(0, 0);
  refresh();
}

const OCC = {EMPTY:1, MANY_SEATS_AVAILABLE:1, FEW_SEATS_AVAILABLE:2, STANDING_ROOM_ONLY:3, CRUSHED_STANDING_ROOM_ONLY:3, FULL:3};
function carsOf(v){
  const a = v.attributes;
  const c = (a.carriages || []).filter(x => x.label).map(x => ({n:x.label, o:OCC[x.occupancy_status] || 0}));
  return c.length ? c : (a.label || '').split('-').filter(Boolean).map(n => ({n, o:0}));
}

function parsePred(j){
  const inc = {};
  (j.included || []).forEach(x => inc[x.type + x.id] = x);
  const now = Date.now();
  return j.data.map(p => {
    const a = p.attributes, rl = p.relationships;
    const t = Date.parse(a.arrival_time || a.departure_time);
    const vid = rl.vehicle.data && rl.vehicle.data.id;
    const v = vid && inc['vehicle' + vid];
    const tr = rl.trip.data && inc['trip' + rl.trip.data.id];
    const x = {tid:rl.trip.data && rl.trip.data.id, r:rl.route.data.id, d:a.direction_id, t, dt:Date.parse(a.departure_time), vid, h:tr ? tr.attributes.headsign : '', cars:v ? carsOf(v) : []};
    if (vid) TV[vid] = x;
    return x;
  }).filter(x => !isNaN(x.t) && x.t - now > -60000);
}
const TV = {};
const PQ = '&include=vehicle,trip&fields[vehicle]=label,carriages&fields[trip]=headsign';

function ok(){ okT = Date.now(); $('main').classList.remove('dim'); age(); }
function fail(){ $('main').classList.add('dim'); age(true); }
function age(off){
  const s = okT ? Math.round((Date.now() - okT) / 1000) : 0;
  const t = s < 90 ? s + 's' : Math.round(s/60) + 'm';
  $('age').textContent = off ? 'offline' + (s >= 30 ? ' · ' + t : '') : s >= 30 ? t + ' old' : '';
}

async function refresh(){
  if (view === 'trains') return loadStop();
  if (view === 'ride') return loadRide();
  if (view === 'find2') return loadFind();
  if (view === 'num2') return loadNum();
  if (view === 'bus3') return loadBus();
  if (view === 'hol') return loadHol();
}

// Trains that just pulled out stay on screen (marked "Left") so you can still tap the one you boarded.
const KEEP = 30000;
let lastFor = null;
async function loadStop(){
  if (!stop) return;
  try {
    const rs = routes().filter(r => (stop.r || []).includes(r)).join(',');
    const j = await api(`/predictions?filter[stop]=${stop.id}&filter[route]=${rs}` + PQ);
    if (view !== 'trains') return;
    const now = Date.now(), fresh = parsePred(j);
    const old = lastFor === stop.id ? last : [];
    const left = old.filter(x => x.vid && !fresh.some(y => y.vid === x.vid) && (x.gone || x.t - now < 120000))
      .map(x => x.gone ? x : Object.assign({}, x, {gone:now})).filter(x => now - x.gone < KEEP);
    last = fresh.concat(left); lastFor = stop.id;
    got = now; ok();
    render();
    loadAlerts(rs);
    if (TERM[stop.id]) loadLay(rs);
  } catch(e) { fail(); }
}

async function loadLay(rs){
  try {
    const j = await api(`/vehicles?filter[route]=${rs}&include=stop,trip`);
    if (view !== 'trains') return;
    const inc = {};
    (j.included || []).forEach(x => inc[x.type + x.id] = x);
    const id = stop.id;
    lay = j.data.filter(v => {
      if (v.attributes.current_status !== 'STOPPED_AT') return false;
      const s = v.relationships.stop.data && inc['stop' + v.relationships.stop.data.id];
      const ps = s && s.relationships && s.relationships.parent_station && s.relationships.parent_station.data;
      return s && (s.id === id || (ps && ps.id === id));
    }).map(v => {
      const tr = v.relationships.trip.data && inc['trip' + v.relationships.trip.data.id];
      return TV[v.id] = {vid:v.id, r:v.relationships.route.data.id, d:v.attributes.direction_id, h:tr ? tr.attributes.headsign : '', cars:carsOf(v), sid:id};
    });
    render();
  } catch(e) {}
}

const SKIP = ['ELEVATOR_CLOSURE','ESCALATOR_CLOSURE','ACCESS_ISSUE','PARKING_CLOSURE','PARKING_ISSUE','BIKE_ISSUE','FACILITY_ISSUE'];
async function loadAlerts(rs){
  if (AL.id === stop.id && Date.now() - AL.t < 120000) return;
  try {
    const j = await api(`/alerts?filter[route]=${rs}&filter[datetime]=NOW&fields[alert]=header,effect,informed_entity`);
    const id = stop.id;
    AL = {id, t:Date.now(), list:j.data.map(x => x.attributes).filter(a => !SKIP.includes(a.effect)
      && (a.informed_entity || []).some(e => !e.stop || e.stop === id)).map(a => esc(a.header))};
    if (view === 'trains') render();
  } catch(e) {}
}

const clock = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(/\s?[AP]M/i, '');
const dep = x => !!x.gone || (x.dt < Date.now() - 5000);
function when(t){
  const s = (t - Date.now()) / 1000;
  return s <= 30 ? 'Now' : s < 90 ? '1 min' : Math.round(s/60) + ' min';
}

const isX = (c, r) => HOLIDAY && (XMAS[r === 'Bus' ? 'Bus' : lineOf(r || (c.startsWith('3') ? 'Green' : 'Red'))] || []).includes(c);
const cls = (c, r, o) => (r === 'Orange' ? 'fO' + (o || 0) : r === 'Bus' ? 'fBus' : 'f' + c.slice(0,2)) + (isX(c, r) ? ' xmas' : '');
const done = (c, r) => { const L = lineOf(r); return rides.some(x => (x.c === c || x.p === c) && (x.l ? x.l === L : L === 'Red' || L === 'Green')); };
// Red Line married pair: the car coupled right next to it in the live consist, numbered one off (1630/1631).
// Green Line cars log on their own. If no partner is found, only the tapped car is logged.
function pairOf(cars, i, r){
  if (r !== 'Red' || cars.length < 2) return '';
  const n = +cars[i].n, nb = [cars[i-1], cars[i+1]].filter(Boolean).find(x => +x.n === (n ^ 1));
  return nb ? nb.n : '';
}
const carH = (r, vid, all, B) => (x, j) => r === 'Orange' || r === 'Blue' ? `<div class="car ${cls(x.n, r, x.o)}${B && B.has(x.n) ? ' best' : ''}"><i></i><span>${x.n}</span><u></u></div>`
  : `<div class="car ${cls(x.n, r)}${done(x.n, r) ? ' got' : ''}${B && B.has(x.n) ? ' best' : ''}" data-c="${x.n}" data-r="${r}" data-p="${all ? pairOf(all, all.indexOf(x), r) : ''}"${vid ? ` data-v="${vid}"` : ''}><i></i><span>${x.n}</span><u></u>${x.o ? `<b class="oc o${x.o}"></b>` : ''}</div>`;
// Which car you'd rather ride: lower score is better. null = no preference.
//  Red 1500/1600/1700: 1600 > 1500 > 1700. Red 1900s and Orange: least crowded (green, then yellow).
//  1800s: no preference. Green: Type 7 or Type 9 over Type 8.
function pref(x, r){
  const f = x.n.slice(0, 2);
  if (r === 'Orange' || (r === 'Red' && f === '19')) return x.o ? x.o : null;
  if (r === 'Red') return {'16':1, '15':2, '17':3}[f] || null;
  if (r.startsWith('Green')) return {'36':1, '37':1, '39':1, '38':2}[f] || null;
  return null;
}
function bestOf(cars, r){
  const s = cars.map(x => pref(x, r)), ok = s.filter(v => v != null);
  if (ok.length < 2) return new Set();
  const m = Math.min(...ok);
  if (ok.every(v => v === m)) return new Set();
  return new Set(cars.filter((x,i) => s[i] === m).map(x => x.n));
}
const mini = (cars, r) => `<span class="mini">${cars.map(x => `<div class="car ${cls(x.n, r, x.o)}"><i></i><span></span><u></u></div>`).join('')}</span>`;
const keyOf = x => x.vid || x.r + x.t;
let exp = null, expT = null;
const ENDS = {Red:[['ashmont','braintree'],['alewife']], 'Green-B':[['boston college'],['government center']], 'Green-C':[['cleveland circle'],['government center']], 'Green-D':[['riverside'],['union square']], 'Green-E':[['heath street'],['medford/tufts']], Orange:[['forest hills'],['oak grove']]};
const short = x => x.h && ENDS[x.r] && !ENDS[x.r][x.d].some(e => x.h.toLowerCase().includes(e));
const headOf = x => (short(x) ? '<em>short</em>' : '') + (x.r.startsWith('Green') ? x.r.slice(-1) + ' · ' : '') + x.h;
const trainH = (x, tap) => `<div class="tr"><div class="hd${tap && x.vid ? ' tap' : ''}"${tap && x.vid ? ` data-ride="${x.vid}"` : ''}><span>${headOf(x)}</span><b class="${dep(x) ? 'left' : x.t - Date.now() < 90000 ? 'soon' : ''}">${dep(x) ? 'DEP.' : when(x.t)}</b></div>${consist(x.cars, x.r, x.vid)}</div>`;

function consist(cars, r, vid){
  if (!cars.length) return '<div class="none">Cars not assigned yet</div>';
  if (cars.length === 1 && r === 'Red') return `<div class="ln"><div class="e">FWD</div><div class="cs">${carH(r, vid)(cars[0])}<div class="none" style="flex:2;align-self:center">lead car only</div></div></div>`;
  const L = [], B = bestOf(cars, r);
  for (let i = 0; i < cars.length; i += 3) L.push(cars.slice(i, i+3));
  return L.map((l,i) => `<div class="ln"><div class="e">${i ? 'MID' : 'FWD'}</div><div class="cs">${l.map(carH(r, vid, cars, B)).join('')}</div><div class="e r">${i === L.length-1 ? 'AFT' : 'MID'}</div></div>`).join('');
}

function render(){
  if (view !== 'trains') return;
  let h = AL.id === stop.id ? AL.list.slice(0, 3).map((t,i) => `<div class="al${alOpen === i ? ' open' : ''}" data-al="${i}">${t}</div>`).join('') : '';
  const wl = TERM[stop.id] ? lay.filter(v => v.sid === stop.id) : [];
  if (wl.length) h += '<div class="sec">Waiting here</div>' + wl.map(v => {
    const p = last.find(x => x.vid === v.vid);
    return `<div class="tr"><div class="hd"><span>${headOf(v)}</span><b>${p ? 'leaves ' + when(p.t) : 'no time yet'}</b></div>${consist(v.cars, v.r, v.vid)}</div>`;
  }).join('');
  for (const g of GROUPS) {
    const rs = g.r.filter(r => (stop.r || []).includes(r) && !isTerm(stop.id, r, g.d));
    if (!rs.length) continue;
    const all = last.filter(x => rs.includes(x.r) && x.d === g.d && !wl.some(v => v.vid === x.vid) && !(x.gone && Date.now() - x.gone >= KEEP)).sort((a,b) => a.t - b.t);
    const lab = g.l || rs.map(r => r.slice(-1)).sort().join(' and ') + (g.d ? ' · inbound' : ' · outbound');
    h += `<div class="sec ${g.c}">${lab}</div>`;
    if (!all.length) h += wl.some(v => v.d === g.d && rs.includes(v.r)) ? '<div class="none">Next one is waiting above</div>' : '<div class="none">None predicted right now</div>';
    all.slice(0, 2).forEach(x => h += trainH(x, true));
    all.slice(2, 5).forEach(x => h += exp === keyOf(x) ? trainH(x, true) : `<div class="lat" data-x="${keyOf(x)}"><span>${headOf(x)}</span>${mini(x.cars, x.r)}<b>${when(x.t)}</b></div>`);
  }
  $('main').innerHTML = h || '<div class="msg">No trains predicted right now.</div>';
}

function startRide(vid, o){
  const x = o || TV[vid] || last.find(y => y.vid === vid);

  ride = {vid, r:x.r, d:x.d, h:x.h, cars:x.cars, at:null};

const XFER = {};
let GLD = {t:0, on:false};
const GL_TRUNK = ['place-pktrm','place-boyls','place-armnl','place-coecl','place-gover','place-hymnl','place-kencl'];
async function glDown(){
  if (Date.now() - GLD.t < 120000) return GLD.on;
  try {
    const j = await api('/alerts?filter[route]=Green-B,Green-C,Green-D,Green-E&filter[datetime]=NOW&fields[alert]=effect,informed_entity');
    GLD = {t:Date.now(), on:j.data.some(a => ['SHUTTLE','SUSPENSION'].includes(a.attributes.effect)
      && (a.attributes.informed_entity || []).some(e => !e.stop || GL_TRUNK.includes(e.stop)))};
  } catch(e) { GLD.t = Date.now(); }
  return GLD.on;
}

async function peek(sid, after, mine, only){
  const s = stops.find(x => x.id === sid);
  const rs = (s ? s.r : []).filter(r => lineOf(r) !== lineOf(mine) || (sid === 'place-kencl' && r !== mine));
  if (!rs.length) return null;
  const c = XFER[sid];
  if (!c || Date.now() - c.t > 45000) XFER[sid] = {t:Date.now(), p:parsePred(await api(`/predictions?filter[stop]=${sid}&filter[route]=${rs.join(',')}` + PQ))};
  return XFER[sid].p.filter(x => x.t > after + 30000 && (!only || (x.r === only.r && x.d === only.d))).sort((a,b) => a.t - b.t).slice(0, 3);
}

async function loadRide(){
  try {
    const j = await api(`/vehicles/${encodeURIComponent(ride.vid)}?include=stop,trip`);
    if (view !== 'ride') return;
    const v = j.data, inc = {};
    (j.included || []).forEach(x => inc[x.type + x.id] = x);
    ride.cars = carsOf(v);
    const st = v.relationships.stop.data && inc['stop' + v.relationships.stop.data.id];
    const tr = v.relationships.trip.data && inc['trip' + v.relationships.trip.data.id];
    if (tr) ride.h = tr.attributes.headsign;
    const here = v.attributes.current_status === 'STOPPED_AT';
    ride.at = st ? st.attributes.name : '';
    let ups = [];
    if (tr) {
      const q = await api(`/predictions?filter[trip]=${encodeURIComponent(tr.id)}&include=stop&sort=stop_sequence`);
      if (view !== 'ride') return;
      const si = {};
      (q.included || []).forEach(x => si[x.id] = x);
      ups = q.data.map(p => {
        const s = si[p.relationships.stop.data.id], ps = s && s.relationships && s.relationships.parent_station && s.relationships.parent_station.data;
        return {sid:ps ? ps.id : p.relationships.stop.data.id, n:s ? s.attributes.name : '', t:Date.parse(p.attributes.arrival_time || p.attributes.departure_time)};
      }).filter(x => !isNaN(x.t) && x.t > Date.now() - 30000);
    }
    const red = ride.r === 'Red', gd = red && ride.d === 0 && await glDown();
    if (view !== 'ride') return;
    const PIN = gd ? [GLDOWN_PIN] : (PINS[lineOf(ride.r)] || [[],[]])[ride.d] || [];
    const row = (x, pin) => `<div class="sr${pin ? ' pin' : ''}"><span>${esc(x.n)}</span><b>${pin ? when(x.t) + ' | ' + clock(x.t) : when(x.t)}</b></div>`;
    const pins = ups.filter(x => PIN.includes(x.sid));
    let h = (gd ? '<div class="big"><b>⚠️ Green Line shuttles</b>Get off at Downtown Crossing for the Orange Line to Forest Hills.</div>' : '')
      + `<div class="sec ${(GROUPS.find(g => g.r.includes(ride.r)) || {}).c}">${headOf(ride)}</div>`
      + `<div class="ns"><small>${here ? 'At' : 'Next stop'}</small><div><span>${esc(ride.at)}</span><b>${here ? 'now' : ups[0] ? when(ups[0].t) : ''}</b></div></div>`
      + consist(ride.cars, ride.r);
    if (pins.length) h += '<div class="sec">Your stops</div>' + pins.map(x => row(x, true)).join('');
    const xs = ups.filter(x => !(gd && x.sid === 'place-pktrm')).filter(x => { const s = stops.find(y => y.id === x.sid); return s && s.r.some(r => lineOf(r) !== lineOf(ride.r)) || x.sid === 'place-kencl'; });
    const xfer = (xs.filter(x => PIN.includes(x.sid)).concat(xs)).filter((x,i,a) => a.findIndex(y => y.sid === x.sid) === i).slice(0, 2);
    for (const x of xfer) {
      const p = await peek(x.sid, x.t, ride.r, gd && x.sid === GLDOWN_PIN ? {r:'Orange', d:0} : null);
      if (view !== 'ride') return;
      if (p && p.length) h += `<div class="sec">Connections at ${esc(x.n)} · you arrive ${when(x.t)}</div>`
        + p.map(y => `<div class="lat"><span>${headOf(y)}</span>${mini(y.cars, y.r)}<b>${when(y.t)}</b></div>`).join('');
    }
    if (ups.length) h += '<div class="sec">All stops</div>' + ups.map(x => row(x, PIN.includes(x.sid))).join('');
    else h += '<div class="none">No stop times right now</div>';
    $('main').innerHTML = h; ok();
  } catch(e) {
    if (e.message === '404') { $('main').innerHTML = '<div class="msg">This train finished its trip.</div>'; return; }
    fail();
  }
}

  $('main').innerHTML = `<div class="num">${numIn || '····'}</div><div class="kp">`
    + [1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')
    + '<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="go">Go</button></div>';
}

async function loadNum(){
  try {
    const j = await api(`/vehicles?filter[route]=${routes().join(',')}&include=stop,trip`);
    if (view !== 'num2') return;
    const inc = {};
    (j.included || []).forEach(x => inc[x.type + x.id] = x);
    const v = j.data.find(v => carsOf(v).some(c => c.n === numQ));
    if (!v) { $('main').innerHTML = `<div class="msg">${numQ} isn’t running right now.</div>`; ok(); return; }
    const r = v.relationships.route.data.id, cars = carsOf(v), pos = cars.findIndex(c => c.n === numQ) + 1;
    const s = v.relationships.stop.data && inc['stop' + v.relationships.stop.data.id];
    const tr = v.relationships.trip.data && inc['trip' + v.relationships.trip.data.id];
    const o = {vid:v.id, r, d:v.attributes.direction_id, h:tr ? tr.attributes.headsign : '', cars};
    const st = v.attributes.current_status === 'STOPPED_AT' ? 'At' : 'Next';
    $('main').innerHTML = `<div class="sec ${(GROUPS.find(g => g.r.includes(r)) || {}).c}">${headOf(o) || r}</div>`
      + `<div class="hd" style="margin-top:4px"><span>${s ? st + ': ' + esc(s.attributes.name) : ''}</span><b>car ${pos} of ${cars.length}</b></div>`
      + consist(cars, r, v.id) + `<button data-follow="1">Follow this train</button>`;
    numO = o; ok();
  } catch(e) { fail(); }
}
let numO = null;

function find1(){
  view = 'find1'; nav();
  $('st').textContent = 'Where are you?';
  const b = (s,k) => `<button data-f="${s.id}"${k ? ' class="kid"' : ''}>${s.n}</button>`;
  $('main').innerHTML = S.fav.map(id => stops.find(s => s.id === id)).filter(s => s && s.r.includes('Red')).map(s => b(s)).join('')
    + GRP.map((g,i) => g.L === 'Red' && g.list.length ? `<button class="grp R" data-fg="${i}">${openG === i ? '▾' : '▸'} ${g.n}</button>`
      + (openG === i ? g.list.map(s => b(s,1)).join('') : '') : '').join('');
}

const OLD = c => /^1[56]/.test(c.n);
async function loadFind(){
  try {
    const p = parsePred(await api(`/predictions?filter[stop]=${fStop.id}&filter[route]=Red` + PQ));
    if (view !== 'find2') return;
    let h = '';
    for (const d of [0, 1]) {
      if (isTerm(fStop.id, 'Red', d)) continue;
      const x = p.filter(y => y.d === d && y.cars.some(OLD)).sort((a,b) => a.t - b.t)[0];
      h += `<div class="sec R">${d ? 'Northbound' : 'Southbound'}</div>` + (x ? trainH(x, false) : '<div class="none">No 1500/1600s headed here yet</div>');
    }
    const seen = new Set(p.filter(y => y.cars.some(OLD)).map(y => y.vid));
    const j = await api('/vehicles?filter[route]=Red&include=stop');
    if (view !== 'find2') return;
    const sn = {};
    (j.included || []).forEach(s => sn[s.id] = s.attributes.name);
    const else_ = j.data.filter(v => !seen.has(v.id) && carsOf(v).some(OLD));
    if (else_.length) h += '<div class="sec">Running elsewhere</div>' + else_.map(v => {
      const s = v.relationships.stop.data;
      return `<div class="lat"><span>${s ? sn[s.id] || '' : ''} · ${v.attributes.direction_id ? 'north' : 'south'}</span>${mini(carsOf(v), 'Red')}</div>`;
    }).join('');
    $('main').innerHTML = h || '<div class="msg">No 1500/1600s running right now.</div>'; ok();
  } catch(e) { fail(); }
}

function sync(a, e){
  if (!SYNC) return;
  fetch(SYNC, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(Object.assign({a}, e))}).catch(() => {});
}

function toast(m, u){
  $('tmsg').textContent = m;
  $('undo').style.display = u ? '' : 'none';
  $('toast').style.display = 'flex';
  clearTimeout(tT);
  tT = setTimeout(() => { $('toast').style.display = 'none'; lastAdd = null; lastChk = null; lastDel = null; }, 5000);
}

function logCar(c, r, p){
  if (done(c, r)) { toast(c + ' already logged'); return; }
  if (p && done(p, r)) p = '';
  lastAdd = {id:'r' + Date.now(), c, p:p || undefined, l:lineOf(r), s:view === 'ride' && ride && ride.at ? ride.at : stop ? stop.n : '', t:Date.now(), ok:false};
  lastChk = null; lastDel = null; rides.unshift(lastAdd); save(); sync('add', lastAdd);
  toast('Logged ' + c + (p ? '/' + p.slice(-2) : ''), true); markCars();
}

function markCars(){ document.querySelectorAll('.car[data-c]').forEach(e => e.classList.toggle('got', done(e.dataset.c, e.dataset.r))); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let lastChk = null;
let lastDel = null;
function undo(){
  if (lastDel) {
    const d = lastDel; lastDel = null; rides.splice(Math.min(d.i, rides.length), 0, d.r); save(); sync('add', d.r);
    if (d.r.ok) sync('check', d.r);
    $('toast').style.display = 'none'; markCars(); if (view === 'log') showLog();
    return;
  }
  if (lastChk) {
    const r = lastChk; lastChk = null; r.ok = false; save(); sync('check', r);
    $('toast').style.display = 'none'; clearTimeout(ckT); if (view === 'log') showLog();
    return;
  }
  if (!lastAdd) return;
  rides = rides.filter(x => x.id !== lastAdd.id); save(); sync('remove', lastAdd);
  lastAdd = null; $('toast').style.display = 'none'; markCars();
}

function showLog(){
  view = 'log';
  $('st').textContent = 'Ride log';
  nav();
  const fmt = t => new Date(t).toLocaleDateString([], {month:'short', day:'numeric'});
  const row = x => `<div class="lr" data-id="${x.id}"><div class="car ${cls(x.c, x.l || '')}"><i></i><span>${x.c}</span><u></u></div>${x.p ? `<div class="car ${cls(x.p, x.l || '')}"><i></i><span>${x.p}</span><u></u></div>` : ''}<small>${x.s}<br>${fmt(x.t)}</small><button class="del" data-del="${x.id}" aria-label="Delete">✕</button></div>`;
  $('main').innerHTML = (rides.length ? rides.map(row).join('') : '<div class="msg">Nothing logged yet. Tap a car number on a train to log it.</div>') + keyH();
}

function showTrains(){
  if (stop) setStop(stop); else picker();
}

document.addEventListener('click', ev => {
  const t = ev.target;
  const car = t.closest('.car[data-c]'); if (car) {
    logCar(car.dataset.c, car.dataset.r, car.dataset.p);
    if (car.dataset.v && view !== 'ride') startRide(car.dataset.v, view === 'num2' ? numO : null);
    return;
  }
  if (t.id === 'busBtn') return bus1();
  const bs = t.closest('[data-bs]'); if (bs) { busSet = +bs.dataset.bs; return bus2(); }
  const bd = t.closest('[data-bd]'); if (bd) { busDir = +bd.dataset.bd; return openBus3(); }
  const dl = t.closest('[data-del]'); if (dl) {
    const i = rides.findIndex(x => x.id === dl.dataset.del); if (i < 0) return;
    lastDel = {r:rides[i], i}; rides.splice(i, 1); save(); sync('remove', lastDel.r);
    lastAdd = null; lastChk = null; toast('Deleted ' + lastDel.r.c, true); markCars(); return showLog();
  }
  const lx = t.closest('[data-x]'); if (lx) { exp = lx.dataset.x; clearTimeout(expT); expT = setTimeout(() => { exp = null; render(); }, 5000); return render(); }
  const rd = t.closest('[data-ride]'); if (rd) return startRide(rd.dataset.ride);
  const al = t.closest('[data-al]'); if (al) { alOpen = alOpen === +al.dataset.al ? -1 : +al.dataset.al; return render(); }
  if (t.id === 'findBtn') { openG = -1; return find1(); }
  if (t.id === 'holBtn') return openHol();
  if (t.id === 'numBtn') { numIn = ''; return keypad(); }
  const k = t.closest('[data-k]'); if (k) {
    const v = k.dataset.k;
    if (v === 'del') numIn = numIn.slice(0, -1);
    else if (v === 'go') { if (!numIn) return; }
    else if (numIn.length < 4) numIn += v;
    if (v === 'go' || numIn.length === 4) { numQ = numIn; numIn = ''; return openNum2(); }
    return keypad();
  }
  if (t.closest('[data-follow]') && numO) return startRide(numO.vid, numO);
  const fg = t.closest('[data-fg]'); if (fg) { openG = openG === +fg.dataset.fg ? -1 : +fg.dataset.fg; return find1(); }
  const f = t.closest('[data-f]'); if (f) { fStop = stops.find(x => x.id === f.dataset.f); return openFind2(); }
  if (t.id === 'age') return refresh();
  const g = t.closest('[data-g]'); if (g) { openG = openG === +g.dataset.g ? -1 : +g.dataset.g; picker(view === 'addfav'); return; }
  if (t.closest('[data-key]')) { keyOpen = !keyOpen; return view === 'log' ? showLog() : picker(); }
  if (t.id === 'backBtn') return goBack();
  if (t.id === 'homeBtn') return goHome();
  if (t.id === 'doneBtn') { showDone = !showDone; return showLog(); }
  if (t.id === 'setBtn') return settings();
  const uf = t.closest('[data-unfav]'); if (uf) { S.fav = S.fav.filter(x => x !== uf.dataset.unfav); saveS(); return settings(); }
  if (t.closest('[data-addfav]')) { openG = -1; return picker(true); }
  if (t.closest('[data-reset]')) {
    if (!armed) { armed = true; settings(); clearTimeout(armT); armT = setTimeout(() => { armed = false; if (view === 'set') settings(); }, 4000); return; }
    armed = false; clearTimeout(armT);
    S = JSON.parse(JSON.stringify(DEF)); saveS(); openG = -1; keyOpen = false;
    try { localStorage.removeItem('settings'); } catch(e) {}
    toast('Settings reset'); return changed();
  }
  const s = t.closest('[data-s]'); if (s) {
    if (view === 'addfav') { if (!S.fav.includes(s.dataset.s)) S.fav.push(s.dataset.s); saveS(); openG = -1; return goBack(); }
    return setStop(stops.find(x => x.id === s.dataset.s));
  }
  if (t.id === 'logBtn') return view === 'log' ? null : showLog();
  if (t.id === 'undo') return undo();
});

setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 20000);
setInterval(() => { if (view === 'trains' && got) render(); if (okT) age($('main').classList.contains('dim')); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });

// ---- Wake tap: after WAKE_MS without a tap, the next tap only refreshes the page (it doesn't press anything).
// Also refreshes on its own when the watch screen wakes up (timers pause while it sleeps).
const WAKE_MS = 5000;
let lastTap = Date.now(), lastTick = Date.now(), wT = null;
function wake(){
  refresh();
  $('wake').style.display = 'block'; clearTimeout(wT); wT = setTimeout(() => $('wake').style.display = 'none', 1200);
}
document.addEventListener('click', ev => {
  const now = Date.now(), idle = now - lastTap > WAKE_MS;
  lastTap = now;
  if (idle && !ev.target.closest('#undo')) { ev.stopImmediatePropagation(); ev.preventDefault(); wake(); }
}, true);
addEventListener('scroll', () => { lastTap = Date.now(); }, {passive:true});
setInterval(() => { const now = Date.now(); if (now - lastTick > 4000) { lastTap = now - WAKE_MS - 1; refresh(); } lastTick = now; }, 1000);
addEventListener('pageshow', () => refresh());
addEventListener('focus', () => refresh());

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('log')) return showLog();
  try { stops = await getStops(); } catch(e) { $('main').innerHTML = '<div class="msg">Can’t reach the MBTA right now.</div>'; return; }
  const s = q.get('stop') && stops.find(x => x.id === q.get('stop'));
  if (s) setStop(s); else picker();
})();
</script>
